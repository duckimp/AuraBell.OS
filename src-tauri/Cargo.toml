[package]
name = "aurabell-os"
version = "1.0.0"
description = "AuraBell.OS - Sistem Otomasi Bel Sekolah & Pengumuman Suara"
authors = ["AuraBell Team"]
license = "MIT"
edition = "2021"

[lib]
name = "aurabell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri = { version = "2.1.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
